<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Stratoscan — Has your investing idea ever worked? Describe an investing idea in plain English and see whether it has ever worked: ten years of daily prices, fees and slippage on every trade, the S&amp;P 500 alongside — and the evidence that the numbers are right."
    />

    <!-- Canonical + robots (defaults; Seo.tsx refines per route).
         %VITE_SITE_URL% is replaced at build time by Vite from the env var
         (see .env.production / .env.example). -->
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:title" content="Stratoscan — Has your investing idea ever worked?" />
    <meta
      property="og:description"
      content="Describe an investing idea in plain English and see whether it has ever worked: ten years of daily prices, fees and slippage on every trade, the S&amp;P 500 alongside — and the evidence that the numbers are right."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:site_name" content="Stratoscan" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stratoscan — Has your investing idea ever worked?" />
    <meta
      name="twitter:description"
      content="Describe an investing idea in plain English and see whether it has ever worked: ten years of daily prices, fees and slippage on every trade, the S&amp;P 500 alongside — and the evidence that the numbers are right."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta name="twitter:site" content="@stratoscan" />

    <title>Stratoscan — Has your investing idea ever worked?</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
