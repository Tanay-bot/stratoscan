# Stratoscan backend — automatic deployment to Fly.io.
#
# Pipeline (mirrors frontend-deploy.yml):
#   1. gate         — hermetic test suites + py_compile. NOTHING deploys unless
#                     every check passes (release-gate philosophy: a red suite
#                     never ships).
#   2. release-gate — OPTIONAL: runs the 15 behavior probes against staging
#                     (scripts/run_release_gate.sh → run_probes.py). Enable via
#                     workflow_dispatch input `run_release_gate` or repository
#                     variable `RUN_RELEASE_GATE=true`. When enabled and any
#                     probe fails, the deploy job below is SKIPPED (blocked).
#   3. secrets      — stage production env vars into the Fly app via
#                     `fly secrets import --stage` (NAME=VALUE pairs on stdin,
#                     GitHub secrets → step env → filtered to non-empty). No
#                     hardcoded values; unset GitHub secrets are SKIPPED so we
#                     never wipe a live Fly secret with an empty string.
#   4. deploy       — `fly deploy --remote-only` (remote builder; hashed
#                     requirements-lock image). The container entrypoint
#                     (docker-entrypoint.sh) runs `alembic upgrade head` (retried
#                     ×5 for cold Neon) BEFORE uvicorn starts — migrations are
#                     therefore part of every deploy, and the healthcheck gate
#                     below proves they succeeded (uvicorn won't start until they
#                     pass).
#   5. healthcheck   — poll https://stratoscan-api.fly.dev/health until 200.
#   6. rollback      — if /health never returns 200, `fly rollback` restores the
#                     previous release and the job fails loudly.
#
# Secrets required (GitHub → Settings → Secrets and variables → Actions):
#   FLY_API_TOKEN          — fly auth token (Dashboard → Account → Access Tokens)
#   DATABASE_URL, BACKTEST_DATABASE_URL, NEWS_DATABASE_URL   (3 Neon DBs)
#   JWT_SECRET, FINNHUB_KEY_01..10, NEWS_FINNHUB_KEY
#   SCREENER_LLM_KEY, BACKTEST_LLM_KEY
#   LLM_PROVIDERS, LLM_BASE_URL, LLM_MODEL, LLM_PROVIDER_TIMEOUT
#   ZAI_BASE_URL/MODEL/KEYS, GEMINI_BASE_URL/MODEL/KEYS,
#   GROQ_BASE_URL/MODEL/KEYS, ZENMUX_BASE_URL/MODEL/KEYS
#   UPSTASH_REDIS_REST_URL, UPSTASH_REDIS_REST_TOKEN, REDIS_RATE_LIMIT_ENABLED
#   SENDGRID_API_KEY, EMAIL_FROM_ADDRESS, EMAIL_VERIFICATION_REQUIRED
#   APP_BASE_URL, CORS_ALLOW_ORIGINS, ADMIN_EMAILS, ALERT_WEBHOOK_URL
#   LOG_LEVEL, LOG_FORMAT, SENTRY_DSN
#   (release-gate only) STAGING_DATABASE_URL + the staging LLM keys above
#
# APP_ENV=production is NOT a secret (config) — set directly in the import.

name: Backend Deploy

on:
  push:
    branches: [main]
    paths:
      - 'stratoscan/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
    inputs:
      run_release_gate:
        description: 'Run the 15 staging behavior probes before deploying (blocks deploy on failure)'
        type: boolean
        default: false

concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: stratoscan

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  gate:
    name: Gate · Hermetic suites + compile
    runs-on: ubuntu-latest
    # Dummy, non-secret config: the app's auth endpoints 503 when JWT_SECRET
    # is absent, and several hermetic suites (test_auth, test_admin,
    # test_personal_data, test_security_fixes, ...) exercise register/login
    # against FakeUserDB — they need the guard to pass, not a real credential.
    env:
      JWT_SECRET: ci-dummy-jwt-secret
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install runtime deps (hashed lock — bit-identical)
        run: pip install --require-hashes -r requirements-lock.txt

      - name: Install dev tools
        run: pip install pytest pytest-mock

      - name: Run every hermetic suite
        run: |
          set -euo pipefail
          failures=0
          for t in tests/test_*.py; do
            mod="tests.$(basename "$t" .py)"
            echo "=== $mod ==="
            python -m "$mod" || failures=$((failures + 1))
          done
          echo "=============================="
          if [ "$failures" -ne 0 ]; then
            echo "❌ $failures suite(s) FAILED — not deploying"
            exit 1
          fi
          echo "✅ ALL SUITES PASSED"

      - name: py_compile all sources
        run: python -m py_compile src/*.py tests/*.py verify_*.py

  # OPTIONAL release gate: runs the 15 behavior probes against staging.
  # Enabled by the workflow_dispatch input or the RUN_RELEASE_GATE repository
  # variable. Uses the conditional-needs pattern: when skipped (disabled), the
  # deploy job proceeds; when enabled and failing, the deploy job is skipped.
  release-gate:
    name: Release gate · 15 staging probes
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_release_gate) || vars.RUN_RELEASE_GATE == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install runtime deps (hashed lock — bit-identical)
        run: pip install --require-hashes -r requirements-lock.txt

      - name: Run release gate (15 probes vs stratoscan_probes)
        run: scripts/run_release_gate.sh --report release-gate-report.md
        env:
          # setup-python's interpreter lives on PATH, not /usr/local/bin —
          # the wrapper resolves PYTHON → python when set.
          PYTHON: python
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          SCREENER_LLM_KEY: ${{ secrets.SCREENER_LLM_KEY }}
          BACKTEST_LLM_KEY: ${{ secrets.BACKTEST_LLM_KEY }}
          LLM_PROVIDERS: ${{ secrets.LLM_PROVIDERS }}
          ZAI_BASE_URL: ${{ secrets.ZAI_BASE_URL }}
          ZAI_MODEL: ${{ secrets.ZAI_MODEL }}
          ZAI_KEYS: ${{ secrets.ZAI_KEYS }}
          GEMINI_BASE_URL: ${{ secrets.GEMINI_BASE_URL }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GEMINI_KEYS: ${{ secrets.GEMINI_KEYS }}
          GROQ_BASE_URL: ${{ secrets.GROQ_BASE_URL }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          GROQ_KEYS: ${{ secrets.GROQ_KEYS }}

      - name: Upload release-gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-report
          path: stratoscan/release-gate-report.md

  deploy:
    name: Deploy → Fly.io
    runs-on: ubuntu-latest
    needs: [gate, release-gate]
    # Run when gate passed AND release-gate is either passed or skipped
    # (disabled). A failed release-gate skips this job → release blocked.
    if: ${{ always() && needs.gate.result == 'success' && (needs.release-gate.result == 'success' || needs.release-gate.result == 'skipped') }}
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: latest

      - name: Stage production secrets to Fly
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKTEST_DATABASE_URL: ${{ secrets.BACKTEST_DATABASE_URL }}
          NEWS_DATABASE_URL: ${{ secrets.NEWS_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FINNHUB_KEY_01: ${{ secrets.FINNHUB_KEY_01 }}
          FINNHUB_KEY_02: ${{ secrets.FINNHUB_KEY_02 }}
          FINNHUB_KEY_03: ${{ secrets.FINNHUB_KEY_03 }}
          FINNHUB_KEY_04: ${{ secrets.FINNHUB_KEY_04 }}
          FINNHUB_KEY_05: ${{ secrets.FINNHUB_KEY_05 }}
          FINNHUB_KEY_06: ${{ secrets.FINNHUB_KEY_06 }}
          FINNHUB_KEY_07: ${{ secrets.FINNHUB_KEY_07 }}
          FINNHUB_KEY_08: ${{ secrets.FINNHUB_KEY_08 }}
          FINNHUB_KEY_09: ${{ secrets.FINNHUB_KEY_09 }}
          FINNHUB_KEY_10: ${{ secrets.FINNHUB_KEY_10 }}
          NEWS_FINNHUB_KEY: ${{ secrets.NEWS_FINNHUB_KEY }}
          SCREENER_LLM_KEY: ${{ secrets.SCREENER_LLM_KEY }}
          BACKTEST_LLM_KEY: ${{ secrets.BACKTEST_LLM_KEY }}
          LLM_PROVIDERS: ${{ secrets.LLM_PROVIDERS }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_PROVIDER_TIMEOUT: ${{ secrets.LLM_PROVIDER_TIMEOUT }}
          ZAI_BASE_URL: ${{ secrets.ZAI_BASE_URL }}
          ZAI_MODEL: ${{ secrets.ZAI_MODEL }}
          ZAI_KEYS: ${{ secrets.ZAI_KEYS }}
          GEMINI_BASE_URL: ${{ secrets.GEMINI_BASE_URL }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GEMINI_KEYS: ${{ secrets.GEMINI_KEYS }}
          GROQ_BASE_URL: ${{ secrets.GROQ_BASE_URL }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          GROQ_KEYS: ${{ secrets.GROQ_KEYS }}
          ZENMUX_BASE_URL: ${{ secrets.ZENMUX_BASE_URL }}
          ZENMUX_MODEL: ${{ secrets.ZENMUX_MODEL }}
          ZENMUX_KEYS: ${{ secrets.ZENMUX_KEYS }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          REDIS_RATE_LIMIT_ENABLED: ${{ secrets.REDIS_RATE_LIMIT_ENABLED }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          EMAIL_FROM_ADDRESS: ${{ secrets.EMAIL_FROM_ADDRESS }}
          EMAIL_VERIFICATION_REQUIRED: ${{ secrets.EMAIL_VERIFICATION_REQUIRED }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CORS_ALLOW_ORIGINS: ${{ secrets.CORS_ALLOW_ORIGINS }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          LOG_FORMAT: ${{ secrets.LOG_FORMAT }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          # Guarantee the secrets file is removed even if a later command in
          # this step fails (the run shell uses set -e, which would otherwise
          # abort before the trailing rm -f and leave secrets on the runner).
          trap 'rm -f /tmp/fly-secrets.txt' EXIT
          python - <<'PY'
          import os, sys

          # Every key the app reads from env, in the order they should land in
          # the Fly app. SKIP empties: a GitHub secret that isn't configured
          # resolves to "" — importing "" would overwrite a live Fly secret
          # with nothing. Also skip values containing newlines (fly secrets
          # import parses one NAME=VALUE pair per line).
          keys = [
              "DATABASE_URL", "BACKTEST_DATABASE_URL", "NEWS_DATABASE_URL",
              "JWT_SECRET",
              "FINNHUB_KEY_01", "FINNHUB_KEY_02", "FINNHUB_KEY_03",
              "FINNHUB_KEY_04", "FINNHUB_KEY_05", "FINNHUB_KEY_06",
              "FINNHUB_KEY_07", "FINNHUB_KEY_08", "FINNHUB_KEY_09",
              "FINNHUB_KEY_10", "NEWS_FINNHUB_KEY",
              "SCREENER_LLM_KEY", "BACKTEST_LLM_KEY",
              "LLM_PROVIDERS", "LLM_BASE_URL", "LLM_MODEL", "LLM_PROVIDER_TIMEOUT",
              "ZAI_BASE_URL", "ZAI_MODEL", "ZAI_KEYS",
              "GEMINI_BASE_URL", "GEMINI_MODEL", "GEMINI_KEYS",
              "GROQ_BASE_URL", "GROQ_MODEL", "GROQ_KEYS",
              "ZENMUX_BASE_URL", "ZENMUX_MODEL", "ZENMUX_KEYS",
              "UPSTASH_REDIS_REST_URL", "UPSTASH_REDIS_REST_TOKEN",
              "REDIS_RATE_LIMIT_ENABLED",
              "SENDGRID_API_KEY", "EMAIL_FROM_ADDRESS",
              "EMAIL_VERIFICATION_REQUIRED",
              "APP_BASE_URL", "CORS_ALLOW_ORIGINS", "ADMIN_EMAILS",
              "ALERT_WEBHOOK_URL", "LOG_LEVEL", "LOG_FORMAT", "SENTRY_DSN",
          ]
          pairs = []
          for k in keys:
              v = os.environ.get(k, "")
              if not v:
                  print(f"  - {k}: unset, skipping (keeps existing Fly value)")
                  continue
              if "\n" in v:
                  print(f"  - {k}: contains newline — skipping (unsupported)", file=sys.stderr)
                  continue
              pairs.append(f"{k}={v}")
          # APP_ENV is deployment config, not a secret — set it directly.
          pairs.append("APP_ENV=production")
          with open("/tmp/fly-secrets.txt", "w") as f:
              f.write("\n".join(pairs) + "\n")
          print(f"Staged {len(pairs)} secrets (incl. APP_ENV=production)")
          PY
          fly secrets import -a stratoscan-api --stage < /tmp/fly-secrets.txt

      - name: Deploy (remote build; entrypoint runs alembic upgrade head)
        id: deploy
        run: fly deploy -a stratoscan-api --remote-only --wait-timeout 900 -y

      - name: Healthcheck gate — /health must return 200
        id: healthcheck
        run: |
          URL="https://stratoscan-api.fly.dev/health"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL" || echo 000)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "✅ /health returned 200"
              exit 0
            fi
            sleep 10
          done
          echo "❌ /health never returned 200 after 30 attempts (~5 min)"
          exit 1

      # Roll back if EITHER the deploy itself failed (e.g. all 5 migration
      # retries failed and the container exited — a real cold-Neon prod path)
      # OR the app came up but /health never returned 200. Rolling back when
      # the deploy failed before producing a release is a harmless no-op back
      # to the still-live previous release.
      - name: Rollback on deploy or healthcheck failure
        if: steps.healthcheck.outcome == 'failure' || steps.deploy.outcome == 'failure'
        run: |
          echo "Rolling back to previous release..."
          fly rollback -a stratoscan-api --yes
