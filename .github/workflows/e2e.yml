# End-to-end journeys (Day 13) — on every push.
#
# Four whole-person flows in a real browser against a real stack: the FastAPI
# app over a throwaway Postgres (service container below) seeded with
# synthetic prices by stratoscan/e2e_stack.py, an SMTP sink standing in for the
# inbox, and the frontend built against that API. Nothing leaves the runner:
# no network calls, no secrets, no paid service.
#
#   1. anonymous   — land → template → backtest → share → open link elsewhere
#   2. new account — signup → verify → backtest → save → logout → login → saved
#   3. recovery    — forgot → reset → old session dead → login with new password
#   4. tiers       — admin sets Pro → export unlocks → back to Free → access ends
#
# Local: start Postgres, then `cd frontend && npx playwright test`.

name: E2E journeys

on:
  push:
  pull_request:

jobs:
  e2e:
    name: Playwright journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stratoscan
          POSTGRES_PASSWORD: stratoscan
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stratoscan"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      E2E_ADMIN_DSN: postgresql://stratoscan:stratoscan@127.0.0.1:5432/postgres
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: stratoscan/requirements-lock.txt
      - name: Backend dependencies
        working-directory: stratoscan
        run: pip install --require-hashes -r requirements-lock.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend dependencies + Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the journeys
        working-directory: frontend
        run: npx playwright test

      - name: Upload the report and traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
