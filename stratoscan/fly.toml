# ─────────────────────────────────────────────────────────────────────────────
# Stratoscan backend — Fly.io config: one image, two process groups.
#
#   app       → ./docker-entrypoint.sh api        (alembic upgrade head, then uvicorn)
#   scheduler → ./docker-entrypoint.sh scheduler  (the data jobs; no HTTP)
#
# Day 15: until now this file had no scheduler at all (the entrypoint starts
# only uvicorn), so production would have run no data jobs and every screen
# would have emptied after seven days. Fly passes each process command as the
# ENTRYPOINT's argument, so the API keeps running migrations first.
#
# Exactly ONE scheduler machine: `fly scale count app=1 scheduler=1`. A second
# one is refused at startup by the scheduler lease (src/job_monitor.py) and
# exits 3 with an alert — but don't rely on the guard, keep the count at 1.
# kill_signal SIGINT stops the scheduler cleanly, which releases its lease.
#
# Deploy:  fly launch --no-deploy   (first time, then fill secrets)
#          fly secrets set ...      (all env vars — see DEPLOY.md)
#          fly deploy
# Roll back: there is no `fly rollback` — redeploy the previous image
#          (`fly releases --image`, then `fly deploy --image <ref>`); see RUNBOOK.md.
# ─────────────────────────────────────────────────────────────────────────────
app = "stratoscan-api"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = 5

[build]
  dockerfile = "Dockerfile"

[processes]
  app = "api"
  scheduler = "scheduler"

[env]
  # Real values come from `fly secrets set` — never commit secrets.
  RATE_LIMIT_ENABLED = "true"
  # The socket peer is Fly's proxy; Fly-Client-IP is set (and overwritten)
  # by Fly's edge — the only trustworthy per-visitor IP (src/config.py).
  CLIENT_IP_HEADER = "Fly-Client-IP"

[http_service]
  processes = ["app"]          # the scheduler serves no HTTP
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"   # one always-on API machine
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "20s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

# 256MB shared VM ≈ $2–3/mo. If the yfinance/LLM jobs OOM during the
# nightly warm cycle, bump to 512mb (≈ $4–5/mo):
# [[vm]]
#   cpu_kind = "shared"
#   cpus = 1
#   memory = "512mb"
